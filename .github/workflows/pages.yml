name: Deploy Site A to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy only when the published Site A artifact or this workflow changes.
    paths:
      - "site-a/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # Keep Site B on its own origin; never upload the repository root.
      - name: Upload Site A only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-a
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
